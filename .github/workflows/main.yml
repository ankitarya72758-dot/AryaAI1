name: Build Arya AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q AryaAI_APK_Ready_v4.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable AndroidX
        working-directory: project
        run: |
          printf "android.useAndroidX=true\n" > gradle.properties
          printf "android.enableJetifier=true\n" >> gradle.properties

      - name: Fix Java and Kotlin JVM target
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          if "compileOptions {" not in text:
              text = text.replace(
                  "    targetSdk = 35\n",
                  """    targetSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              )

          p.write_text(text)
          PY

          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arya-AI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
